<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>Diario de trabajos</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --card2:#fafbfc; --text:#12181d; --muted:#67737e;
  --line:#e2e6ea; --line2:#eef1f4;
  --accent:#1f6feb; --accent-ink:#ffffff; --accent-soft:#e8f0fe;
  --danger:#c62828; --danger-soft:#fdecec;
  --ok:#1b7f3b; --ok-soft:#e7f5ec;
  --warn:#8a5a00; --warn-soft:#fff5e0;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(16,24,32,.06), 0 1px 3px rgba(16,24,32,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1317; --card:#171d23; --card2:#1d242b; --text:#e8edf2; --muted:#93a1ad;
    --line:#2a333c; --line2:#222a31;
    --accent:#4b8ef7; --accent-ink:#06121f; --accent-soft:#17263c;
    --danger:#ff6b6b; --danger-soft:#2d1a1a;
    --ok:#4ade80; --ok-soft:#14271b;
    --warn:#fbbf5c; --warn-soft:#2b2113;
    --sh:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1317; --card:#171d23; --card2:#1d242b; --text:#e8edf2; --muted:#93a1ad;
  --line:#2a333c; --line2:#222a31;
  --accent:#4b8ef7; --accent-ink:#06121f; --accent-soft:#17263c;
  --danger:#ff6b6b; --danger-soft:#2d1a1a;
  --ok:#4ade80; --ok-soft:#14271b;
  --warn:#fbbf5c; --warn-soft:#2b2113;
  --sh:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-wrap:break-word;
}
body.sinnav{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
input,select,textarea,button{font:inherit;color:inherit}

/* ---------- cabecera ---------- */
header.top{
  position:sticky; top:0; z-index:30; background:var(--card);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; gap:12px; min-height:56px;
}
header.top .ttl{font-size:17px;font-weight:650;flex:1;min-width:0}
header.top .sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  background:transparent;border:0;padding:8px;margin:-8px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:var(--text);flex:0 0 auto;
}
.iconbtn:active{background:var(--line2)}
.iconbtn svg{width:22px;height:22px;display:block}

main{padding:14px 16px 20px; max-width:620px; margin:0 auto}

/* ---------- piezas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card.pad{padding:14px}
.card-h{padding:12px 14px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:650;
  text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.xsmall{font-size:11.5px}
.center{text-align:center}
.right{text-align:right}
.mt{margin-top:14px}
.mb{margin-bottom:10px}
.hr{height:1px;background:var(--line2);margin:12px 0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 16px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--card);cursor:pointer;
  font-weight:600;font-size:15px;
}
.btn:active{transform:scale(.985)}
.btn.block{display:flex;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger.fill{background:var(--danger-soft);border-color:var(--danger-soft)}
.btn.ok{color:var(--ok)}
.btn.big{min-height:62px;font-size:17px;border-radius:var(--r)}
.btn svg{width:19px;height:19px;flex:0 0 auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>.btn{flex:1 1 auto}

.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:650;
  letter-spacing:.02em;vertical-align:middle}
.badge.open{background:var(--warn-soft);color:var(--warn)}
.badge.done{background:var(--ok-soft);color:var(--ok)}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip.b{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.chip.tap{cursor:pointer;min-height:36px;color:var(--text)}
.chip.tap:active{background:var(--line2)}

/* listas pulsables */
.lst{display:block}
.li{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;background:var(--card);border:0;border-top:1px solid var(--line2);
  cursor:pointer;min-height:58px;
}
.li:first-child{border-top:0}
.li:active{background:var(--card2)}
.li .gro{flex:1;min-width:0}
.li .t{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.li .amt{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.li .amt .v{font-weight:650;font-size:15px}
.li .chev{color:var(--muted);flex:0 0 auto;opacity:.6}
.li .chev svg{width:18px;height:18px;display:block}
.grouph{padding:14px 14px 6px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);background:var(--card);border-top:1px solid var(--line2)}
.grouph:first-child{border-top:0}

/* campos */
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{
  width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--card);
}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea.inp{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:5px}

/* contadores */
.cnt{padding:13px 14px;border-top:1px solid var(--line2)}
.cnt:first-child{border-top:0}
.cnt .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.cnt .lab .n{font-weight:600;font-size:15px;min-width:0}
.cnt .lab .u{font-size:12px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.cnt .ctrl{display:flex;align-items:center;gap:9px}
.cnt .val{
  flex:1 1 auto;width:100%;min-width:0;min-height:50px;padding:8px 4px;
  font-variant-numeric:tabular-nums;font-weight:700;font-size:21px;text-align:center;
  border:1px solid var(--line);border-radius:12px;background:var(--card2);
}
.cnt .val:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--card)}
.stepb{
  width:52px;height:50px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);display:grid;place-items:center;cursor:pointer;font-size:22px;font-weight:600;line-height:1;
}
.stepb:active{background:var(--accent-soft);border-color:var(--accent)}
.stepb.sm{font-size:14px;font-weight:700}

/* materiales */
.mat{padding:12px 14px;border-top:1px solid var(--line2)}
.mat .r1{display:flex;gap:8px;align-items:center}
.mat .r2{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.mat .r2 .f{flex:1;min-width:0}
.mat .r2 .f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.mat .imp{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:650;padding-bottom:12px;min-width:72px;text-align:right}
.delb{width:40px;height:40px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--danger);display:grid;place-items:center;cursor:pointer}
.delb svg{width:17px;height:17px}

/* avisos */
.note{display:flex;gap:11px;padding:13px 14px;border-radius:var(--r);margin-bottom:14px;font-size:13.5px;line-height:1.4}
.note.w{background:var(--warn-soft);color:var(--warn)}
.note.d{background:var(--danger-soft);color:var(--danger)}
.note.i{background:var(--accent-soft);color:var(--accent)}
.note svg{width:19px;height:19px;flex:0 0 auto;margin-top:1px}
.note b{font-weight:700}

/* totales */
.tot{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2)}
.tot>div{background:var(--card);padding:12px 14px}
.tot .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tot .v{font-weight:700;font-size:18px;margin-top:3px;font-variant-numeric:tabular-nums}
.totbig{display:flex;justify-content:space-between;align-items:baseline;padding:14px;
  border-top:1px solid var(--line);background:var(--card2)}
.totbig .v{font-weight:750;font-size:22px;font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:var(--sh)}

/* navegación inferior */
nav.bot{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
body.sinnav nav.bot{display:none}
nav.bot a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 2px 7px;font-size:11px;color:var(--muted);font-weight:600;
}
nav.bot a svg{width:23px;height:23px}
nav.bot a[aria-current="page"]{color:var(--accent)}

/* barra guardar */
.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.savebar .t{flex:1;min-width:0}
.savebar .t .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.savebar .t .v{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.savebar .btn{flex:0 0 auto;min-width:140px}

.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.35;margin-bottom:10px}
.empty p{margin:0 0 4px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  background:#12181d;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw;text-align:center;
}
:root[data-theme="dark"] .toast{background:#e8edf2;color:#12181d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#e8edf2;color:#12181d}}

dialog.sheet{
  border:0;padding:0;background:var(--card);color:var(--text);
  border-radius:16px 16px 0 0;width:100%;max-width:620px;
  margin:auto auto 0;box-shadow:0 -4px 24px rgba(0,0,0,.2);
}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
dialog.sheet .body{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
dialog.sheet h3{margin-bottom:12px;font-size:17px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<nav class="bot" id="nav"></nav>
<div id="savebar"></div>
<datalist id="dl-mat"></datalist>
<script src="./vendor/jspdf.umd.min.js"></script>
<script src="./vendor/jspdf.plugin.autotable.min.js"></script>
<script>
'use strict';
/* =========================================================
   DIARIO DE TRABAJOS — datos locales en el móvil
   ========================================================= */

const DBN='diario-trabajos', STORE='kv', KEY='datos', LSKEY='diario-copia-seguridad';
let D=null;            /* todos los datos, en memoria */
let borrador=null;     /* apunte que se está editando */
let toastT=null;

function estadoNuevo(){
  return {
    v:1,
    ajustes:{ titular:'', nif:'', telefono:'', email:'',
              tOficial:0, tAyudante:0, pDespl:0, tema:'auto' },
    clientes:[], referencias:[], apuntes:[], catalogo:[],
    meta:{ ultimaCopia:null, creado:new Date().toISOString() }
  };
}

/* ---------- IndexedDB (un único documento JSON) ---------- */
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbGet(k){
  const db=await idb();
  return new Promise((res,rej)=>{
    const q=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  });
}
async function idbPut(k,v){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(v,k);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}

function migrar(d){
  d.ajustes=Object.assign(estadoNuevo().ajustes, d.ajustes||{});
  d.meta=Object.assign({ultimaCopia:null,creado:null}, d.meta||{});
  ['clientes','referencias','apuntes','catalogo'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  d.apuntes.forEach(a=>{ if(!Array.isArray(a.materiales)) a.materiales=[]; });
  return d;
}
async function cargar(){
  let d=null;
  try{ d=await idbGet(KEY); }catch(e){ console.warn('IndexedDB no disponible',e); }
  if(!d){ try{ const ls=localStorage.getItem(LSKEY); if(ls){ d=JSON.parse(ls); console.warn('Recuperado de la copia local'); } }catch(e){} }
  D = (d && d.v) ? migrar(d) : estadoNuevo();
}
let cola=Promise.resolve();
function guardar(){
  cola=cola.then(()=>idbPut(KEY,D)).catch(e=>{ console.error(e); toast('No se pudo guardar'); });
  try{ localStorage.setItem(LSKEY, JSON.stringify(D)); }catch(e){}
  return cola;
}

/* ---------- utilidades ---------- */
const uid=()=> (crypto.randomUUID ? crypto.randomUUID()
                : 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC =['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const z2=n=>String(n).padStart(2,'0');
function isoDe(d){ return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate()); }
function hoyISO(){ return isoDe(new Date()); }
function ayerISO(){ const d=new Date(); d.setDate(d.getDate()-1); return isoDe(d); }
function fFecha(iso){ if(!iso) return '—'; const p=iso.split('-'); return (+p[2])+' '+MESC[+p[1]-1]+' '+p[0]; }
function fFechaC(iso){ if(!iso) return '—'; const p=iso.split('-'); return (+p[2])+' '+MESC[+p[1]-1]; }
function fMesLargo(ym){ const p=ym.split('-'); return MESES[+p[1]-1]+' de '+p[0]; }
function fFechaLarga(iso){
  if(!iso) return '';
  const p=iso.split('-');
  const d=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(d.getTime())) return fFecha(iso);
  try{ const t=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
       return t.charAt(0).toUpperCase()+t.slice(1); }
  catch(e){ return fFecha(iso); }
}
function diasDesde(iso){ if(!iso) return Infinity; const t=new Date(iso).getTime(); if(!isFinite(t)) return Infinity; return Math.floor((Date.now()-t)/86400000); }

const nf2=new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfx=new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
const eur=n=>nf2.format(n||0)+' €';
const nn =n=>nfx.format(n||0);
function pn(s){
  if(s==null||s==='') return 0;
  s=String(s).trim().replace(/[\s€]/g,'');
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  const v=parseFloat(s);
  return isFinite(v)?v:0;
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2800);
}
function ir(h){ location.hash=h; }
function volver(){ if(history.length>1) history.back(); else ir('#/'); }

/* ---------- iconos ---------- */
const sv=(d,extra)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(extra||'')+d+'</svg>';
const I={
  mas:   sv('<path d="M12 5v14M5 12h14"/>'),
  chev:  sv('<path d="M9 18l6-6-6-6"/>'),
  atras: sv('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
  casa:  sv('<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  carpeta:sv('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
  hoja:  sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'),
  rueda: sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7L4.6 7a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  papel: sv('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
  aviso: sv('<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
  info:  sv('<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>'),
  pdf:   sv('<path d="M12 3v12M8 11l4 4 4-4M4 19h16"/>'),
  comp:  sv('<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M12 15V3M8 7l4-4 4 4"/>'),
  ok:    sv('<path d="M20 6L9 17l-5-5"/>'),
  lapiz: sv('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  caja:  sv('<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/>'),
  reloj: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),

/* ---------- accesos al modelo ---------- */
const getCli = id => D.clientes.find(c=>c.id===id);
const getRef = id => D.referencias.find(r=>r.id===id);
const getAp  = id => D.apuntes.find(a=>a.id===id);
const refsDe = cid => D.referencias.filter(r=>r.clienteId===cid);
const apsDe  = rid => D.apuntes.filter(a=>a.referenciaId===rid).sort((a,b)=> a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
const nomCli = cid => { const c=getCli(cid); return c?c.nombre:'(cliente borrado)'; };

function impMat(a){ return (a.materiales||[]).reduce((s,m)=> s + pn(m.c)*pn(m.p), 0); }
function impApunte(a){
  return (a.hOficial||0)*(a.tOficial||0)
       + (a.hAyudante||0)*(a.tAyudante||0)
       + (a.desplazamientos||0)*(a.pDespl||0)
       + impMat(a);
}
function faltaPrecio(a){ return (a.materiales||[]).some(m=> pn(m.c)>0 && pn(m.p)<=0 ); }
function totales(aps){
  const t={n:aps.length,hOf:0,hAy:0,despl:0,nMat:0,impOf:0,impAy:0,impDespl:0,impMat:0,total:0,ultima:'',falta:false};
  aps.forEach(a=>{
    t.hOf+=a.hOficial||0; t.hAy+=a.hAyudante||0; t.despl+=a.desplazamientos||0;
    t.nMat+=(a.materiales||[]).length;
    t.impOf+=(a.hOficial||0)*(a.tOficial||0);
    t.impAy+=(a.hAyudante||0)*(a.tAyudante||0);
    t.impDespl+=(a.desplazamientos||0)*(a.pDespl||0);
    t.impMat+=impMat(a);
    if(a.fecha>t.ultima) t.ultima=a.fecha;
    if(faltaPrecio(a)) t.falta=true;
  });
  t.total=t.impOf+t.impAy+t.impDespl+t.impMat;
  return t;
}
function totalesRef(rid){ return totales(apsDe(rid)); }
function refsAbiertasDe(cid){ return refsDe(cid).filter(r=>r.estado!=='facturada'); }
function clientesConAbiertas(){
  return D.clientes
    .map(c=>{ const rs=refsAbiertasDe(c.id);
      let ult=''; rs.forEach(r=>{ const t=totalesRef(r.id); if(t.ultima>ult) ult=t.ultima; });
      return {c:c, nAbiertas:rs.length, ultima:ult}; })
    .filter(x=>x.nAbiertas>0)
    .sort((a,b)=> b.ultima.localeCompare(a.ultima) || a.c.nombre.localeCompare(b.c.nombre,'es'));
}
function tocarCatalogo(mats){
  (mats||[]).forEach(m=>{
    const d=(m.d||'').trim(); if(!d) return;
    let e=D.catalogo.find(x=>x.d.toLowerCase()===d.toLowerCase());
    if(!e){ e={d:d,p:0,n:0}; D.catalogo.push(e); }
    e.n=(e.n||0)+1;
    if(pn(m.p)>0) e.p=pn(m.p);
  });
  D.catalogo.sort((a,b)=>(b.n||0)-(a.n||0));
  if(D.catalogo.length>400) D.catalogo.length=400;
}
function resumenChips(a){
  const out=[];
  if(a.desplazamientos) out.push(nn(a.desplazamientos)+(a.desplazamientos===1?' despl.':' despl.'));
  if(a.hOficial) out.push(nn(a.hOficial)+' h of.');
  if(a.hAyudante) out.push(nn(a.hAyudante)+' h ay.');
  const nm=(a.materiales||[]).length;
  if(nm) out.push(nm+(nm===1?' material':' materiales'));
  if(!out.length) out.push('vacío');
  return out;
}

ACT['guardar-apunte']=async()=>{
  const b=borrador;
  b.materiales=(b.materiales||[])
    .map(m=>({d:(m.d||'').trim(), c:pn(m.c), p:pn(m.p)}))
    .filter(m=> m.d!=='' || m.c>0 || m.p>0 );
  const sinDesc=b.materiales.find(m=>m.d==='');
  if(sinDesc){ toast('Falta la descripción de un material'); return; }
  if(!b.fecha){ toast('Falta la fecha'); return; }
  if(!b.desplazamientos && !b.hOficial && !b.hAyudante && !b.materiales.length){
    toast('El apunte está vacío'); return;
  }
  tocarCatalogo(b.materiales);
  if(b.id){
    const i=D.apuntes.findIndex(a=>a.id===b.id);
    if(i>=0) D.apuntes[i]=b; else D.apuntes.push(b);
  }else{
    b.id=uid(); b.creado=new Date().toISOString(); D.apuntes.push(b);
  }
  await guardar(); pintaDatalist();
  const rid=b.referenciaId; borrador=null;
  toast('Apunte guardado');
  ir('#/ref/'+rid);
};
ACT['borrar-apunte']=async()=>{

};

function nuevoPDF(titulo, subtitulo){
  if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('No se ha cargado la librería de PDF.');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth();
  const a=D.ajustes;
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(titulo,14,18);
  if(subtitulo){
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(95);
    doc.text(subtitulo,14,24.5); doc.setTextColor(0);
  }
  const lin=[a.titular,a.nif,a.telefono,a.email].filter(x=>String(x||'').trim()!=='');
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(95);
  lin.forEach((l,i)=>doc.text(String(l), W-14, 14+i*4.3, {align:'right'}));
  doc.setTextColor(0);
  doc.setDrawColor(205); doc.setLineWidth(.3); doc.line(14,29,W-14,29);
  return {doc:doc, y:36, W:W};
}
function pieDePagina(doc){
  const n=doc.internal.getNumberOfPages();
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(135);
    doc.text('Diario de trabajos · generado el '+fFecha(hoyISO()), 14, H-8);
    doc.text(i+' / '+n, W-14, H-8, {align:'right'});
  }
  doc.setTextColor(0);
}
const EST={
  theme:'grid',
  styles:{font:'helvetica',fontSize:9,cellPadding:2,lineColor:[221,225,229],lineWidth:.2,textColor:[22,26,30],overflow:'linebreak'},
  headStyles:{fillColor:[31,111,235],textColor:255,fontStyle:'bold'},
  footStyles:{fillColor:[238,242,246],textColor:[22,26,30],fontStyle:'bold'},
  alternateRowStyles:{fillColor:[248,250,251]},
  margin:{left:14,right:14}
};
function tabla(ctx,cfg){
  ctx.doc.autoTable(Object.assign({},EST,cfg,{startY:ctx.y}));
  ctx.y=ctx.doc.lastAutoTable.finalY+7;
}
function seccion(ctx,texto,sub){
  const doc=ctx.doc;
  if(ctx.y>252){ doc.addPage(); ctx.y=20; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(22,26,30);
  doc.text(texto,14,ctx.y);
  if(sub){
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110);
    doc.text(sub,14,ctx.y+4.6); doc.setTextColor(0); ctx.y+=4.6;
  }
  ctx.y+=4.2;
}
function lineasApunte(a){
  const out=[];
  if(a.desplazamientos) out.push(['Desplazamientos', nn(a.desplazamientos), a.pDespl?nn(a.pDespl)+' €':'—', eur(a.desplazamientos*(a.pDespl||0))]);
  if(a.hOficial)  out.push(['Horas de oficial',  nn(a.hOficial)+' h',  a.tOficial?nn(a.tOficial)+' €/h':'—', eur(a.hOficial*(a.tOficial||0))]);
  if(a.hAyudante) out.push(['Horas de ayudante', nn(a.hAyudante)+' h', a.tAyudante?nn(a.tAyudante)+' €/h':'—', eur(a.hAyudante*(a.tAyudante||0))]);
  (a.materiales||[]).forEach(m=>{
    out.push([m.d, nn(m.c), pn(m.p)?nn(m.p)+' €':'SIN PRECIO', eur(pn(m.c)*pn(m.p))]);
  });
  return out;
}
const COLS_DET={0:{cellWidth:21},2:{halign:'right',cellWidth:17},3:{halign:'right',cellWidth:23},4:{halign:'right',cellWidth:24}};
function pintaRojoSinPrecio(data){
  if(data.section==='body' && data.column.index===3 && data.cell.raw==='SIN PRECIO'){
    data.cell.styles.textColor=[198,40,40]; data.cell.styles.fontStyle='bold'; data.cell.styles.fontSize=7.5;
  }
}
function tablaDetalle(ctx,aps){
  const body=[];
  aps.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(a=>{
    const ls=lineasApunte(a);
    ls.forEach((l,i)=>body.push([i===0?fFecha(a.fecha):'', l[0], l[1], l[2], l[3]]));
    if(a.notas) body.push([{content:'Nota: '+a.notas, colSpan:5,
      styles:{fontStyle:'italic',textColor:[110,118,126],fillColor:[252,252,253],fontSize:8}}]);
  });
  const t=totales(aps);
  tabla(ctx,{ head:[['Fecha','Concepto','Cant.','Precio','Importe']], body:body,
    foot:[[{content:'TOTAL',colSpan:4,styles:{halign:'right'}}, {content:eur(t.total),styles:{halign:'right'}}]],
    columnStyles:COLS_DET, didParseCell:pintaRojoSinPrecio });
}
function gruposPorRef(aps){
  const g={};
  aps.forEach(a=>{ (g[a.referenciaId]=g[a.referenciaId]||[]).push(a); });
  return Object.keys(g).filter(k=>getRef(k)).sort((x,y)=>{
    const rx=getRef(x), ry=getRef(y);
    return nomCli(rx.clienteId).localeCompare(nomCli(ry.clienteId),'es') || rx.nombre.localeCompare(ry.nombre,'es');
  }).map(k=>({ref:getRef(k), aps:g[k]}));
}
async function entrega(doc,nombre,modo){
  const blob=doc.output('blob');
  if(modo==='compartir'){
    try{
      const f=new File([blob],nombre,{type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        await navigator.share({files:[f], title:nombre}); return;
      }
      toast('Este móvil no puede compartir ficheros; se descarga');
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('PDF guardado en Descargas');
}
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);

function pdfMensual(ym,modo){

  });
  seccion(ctx,'Resumen por referencia', gs.length+(gs.length===1?' referencia con trabajo este mes':' referencias con trabajo este mes'));

  });
  gs.forEach(g=>{

            (g.ref.estado==='facturada'?'Facturada':'Pendiente de facturar')+' · '+t.n+(t.n===1?' apunte':' apuntes')+' este mes');

    total+=x.t.total; if(x.t.falta) falta=true;
    return [nomCli(x.r.clienteId), x.r.nombre, String(x.t.n), fFecha(x.t.ultima),
            nn(x.t.hOf), nn(x.t.hAy), nn(x.t.despl), eur(x.t.total)+(x.t.falta?' *':'')];
  });
  tabla(ctx,{
    head:[['Cliente','Referencia','Ap.','Último','H. of.','H. ay.','Despl.','Total']],
    body:body,
    foot:[[{content:'TOTAL PENDIENTE',colSpan:7},eur(total)]],
    columnStyles:{2:{halign:'right',cellWidth:11},3:{cellWidth:22},4:{halign:'right',cellWidth:13},
                  5:{halign:'right',cellWidth:13},6:{halign:'right',cellWidth:14},7:{halign:'right',cellWidth:25}}
  });
  if(falta){
    ctx.doc.setFont('helvetica','italic'); ctx.doc.setFontSize(8.5); ctx.doc.setTextColor(198,40,40);
    ctx.doc.text('* Esta referencia tiene materiales sin precio: el total está incompleto.',14,ctx.y);
    ctx.doc.setTextColor(0);
  }
  pieDePagina(ctx.doc);
  entrega(ctx.doc,'pendiente-facturar-'+hoyISO()+'.pdf',modo);
}

}

function aplicarTema(){

  document.documentElement.setAttribute('data-theme', t==='claro'?'light':t==='oscuro'?'dark':'auto');
  const m=document.querySelector('meta[name=theme-color]');

/* ---------- copia de seguridad ---------- */
async function entregaFichero(texto,nombre,tipo,modo){
  const blob=new Blob([texto],{type:tipo});
  if(modo==='compartir'){
    try{
      const f=new File([blob],nombre,{type:tipo});
      if(navigator.canShare && navigator.canShare({files:[f]})){
        await navigator.share({files:[f],title:nombre}); return;
      }
      toast('Este móvil no puede compartir ficheros; se descarga');
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Guardado en Descargas');
}
ACT['copia']=async el=>{
  D.meta.ultimaCopia=hoyISO(); await guardar();
  await entregaFichero(JSON.stringify(D), 'diario-copia-'+hoyISO()+'.json', 'application/json', el.dataset.modo);
  render();
};
ACT['csv']=async()=>{
  const sep=';';
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const fil=[['Fecha','Cliente','Referencia','Estado','Concepto','Cantidad','Precio unidad','Importe','Notas'].join(sep)];
  D.apuntes.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(a=>{
    const r=getRef(a.referenciaId); if(!r) return;
    lineasApunte(a).forEach(l=>{
      fil.push([q(a.fecha),q(nomCli(r.clienteId)),q(r.nombre),q(r.estado||'abierta'),
                q(l[0]),q(l[1]),q(l[2]),q(l[3]),q(a.notas||'')].join(sep));
    });
  });
  if(fil.length===1){ toast('No hay datos que exportar'); return; }
  await entregaFichero('﻿'+fil.join('\r\n'),'diario-'+hoyISO()+'.csv','text/csv','descargar');
};
ACT['restaurar']=()=>{
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files && inp.files[0]; if(!f) return;
    try{
      const txt=await f.text();
      const d=JSON.parse(txt);
      if(!d || !d.v || !Array.isArray(d.apuntes)) throw new Error('El fichero no es una copia del diario');
      if(!confirm('Vas a sustituir TODOS los datos de este móvil por los de la copia:\n\n'+
                  (d.apuntes.length)+' apuntes, '+(d.referencias||[]).length+' referencias.\n\n¿Seguir?')) return;
      D=migrar(d); await guardar(); pintaDatalist(); aplicarTema();
      toast('Copia restaurada'); ir('#/'); render();
    }catch(e){ console.error(e); alert('No se ha podido restaurar: '+e.message); }
  };
  inp.click();
};

ACT['renom-cli']=async el=>{
  const c=getCli(el.dataset.id);
  const n=prompt('Nombre del cliente:', c.nombre);
  if(n===null) return;
  if(!n.trim()){ toast('No puede quedar vacío'); return; }
  c.nombre=n.trim(); await guardar(); render();
};
ACT['borrar-cli']=async el=>{
  const c=getCli(el.dataset.id);
  if(refsDe(c.id).length){ toast('Tiene referencias; bórralas primero'); return; }
  if(!confirm('¿Eliminar el cliente "'+c.nombre+'"?')) return;
  D.clientes=D.clientes.filter(x=>x.id!==c.id);
  await guardar(); toast('Cliente eliminado'); render();
};

/* =========================================================
   ARRANQUE
   ========================================================= */
(async function arranque(){
  try{ await cargar(); }
  catch(e){ console.error(e); D=estadoNuevo(); }
  aplicarTema();
  pintaDatalist();
  window.addEventListener('hashchange',render);
  if(!location.hash) location.replace('#/');
  render();
  try{
    if(navigator.storage && navigator.storage.persist){
      const ya=await navigator.storage.persisted();
      if(!ya) await navigator.storage.persist();
    }
  }catch(e){}
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
